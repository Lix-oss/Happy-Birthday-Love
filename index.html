<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>If My Heart Could Sit Beside You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1233; --moon:#f3e6f0; --sun:#f6c27a; --rose:#f2a7bd;
  --a:#1a1233; --b:#4a2155; --script:'Great Vibes',cursive;
  --display:'Cormorant Garamond',Georgia,serif; --body:'Lora',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--moon);font-family:var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

/* sky */
#sky{position:fixed;inset:0;background:linear-gradient(160deg,var(--a),var(--b));transition:background 1.2s}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--moon);opacity:.7;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
#moon{position:fixed;top:5vh;right:7vw;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff,var(--moon) 60%,#aab3d6);box-shadow:0 0 50px 8px rgba(223,228,247,.3)}
#sun{position:fixed;bottom:6vh;left:6vw;width:34px;height:34px;border-radius:50%;
  background:var(--sun);box-shadow:0 0 40px 10px rgba(244,184,96,.35)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;transition:opacity .9s;opacity:1}
.screen.off{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .9s,visibility 0s .9s}

/* intro */
#intro{justify-content:center;gap:5vh}
#floater{animation:bob 6s ease-in-out infinite;transition:transform 1.4s ease-in,opacity 1.2s;perspective:900px;cursor:pointer;padding:30px}
#floater.go{transform:scale(2.6);opacity:0}
@keyframes bob{50%{transform:translateY(-18px) rotateZ(2deg)}}
.book{width:210px;height:290px;position:relative;transform-style:preserve-3d;animation:spin 26s ease-in-out infinite}
@keyframes spin{0%{transform:rotateX(-8deg) rotateY(-20deg)}40%{transform:rotateX(-8deg) rotateY(20deg)}55%{transform:rotateX(-8deg) rotateY(160deg)}70%{transform:rotateX(-8deg) rotateY(200deg)}100%{transform:rotateX(-8deg) rotateY(340deg)}}
.f{position:absolute;overflow:hidden;backface-visibility:hidden}
.cover{width:210px;height:290px;border-radius:3px 8px 8px 3px;background:linear-gradient(145deg,#3b2a63,#7a4a78);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:var(--display);font-size:22px;line-height:1.2;color:var(--sun)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.front{transform:translateZ(26px)}
.back{transform:translateZ(-26px) rotateY(180deg)}
.spine{width:52px;height:290px;left:-26px;transform:rotateY(-90deg);background:linear-gradient(#2c1f4d,#4a2d5e)}
.pages{width:52px;height:290px;left:184px;transform:rotateY(90deg);background:repeating-linear-gradient(90deg,#f1ecdf 0 2px,#d9d2c0 2px 3px)}
.top{width:210px;height:52px;top:-26px;transform:rotateX(90deg);background:repeating-linear-gradient(0deg,#f1ecdf 0 2px,#d9d2c0 2px 3px)}
.bottom{width:210px;height:52px;top:264px;transform:rotateX(-90deg);background:#cfc7b2}
#shadow{position:absolute;bottom:-44px;left:50%;width:170px;height:20px;margin-left:-85px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(10px);animation:sh 6s ease-in-out infinite}
@keyframes sh{50%{transform:scale(.8);opacity:.6}}
#intro h1{font-family:var(--display);font-weight:500;font-size:clamp(26px,4.4vw,44px);text-align:center;max-width:16em;line-height:1.15;padding:0 20px}
#intro p{font-style:italic;opacity:.75;font-size:15px}

/* contents */
#toc{overflow-y:auto;padding:9vh 20px 8vh}
#toc.off{overflow:hidden}
#toc h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,5vw,48px);margin-bottom:6px;text-align:center}
#toc .dedication{opacity:.7;font-style:italic;margin-bottom:5vh;text-align:center}
#toc ol{list-style:none;width:min(560px,100%);display:grid;gap:12px}
#toc li button{width:100%;text-align:left;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:baseline;
  padding:16px 20px;border-radius:14px;background:rgba(223,228,247,.07);border:1px solid rgba(223,228,247,.14);transition:background .25s,transform .25s}
#toc li button:hover{background:rgba(244,184,96,.14);transform:translateX(4px)}
.num{font-family:var(--display);font-size:24px;color:var(--sun);font-style:italic}
.ct{font-family:var(--display);font-size:24px;line-height:1.1}
.tg{display:block;font-size:13.5px;opacity:.65;margin-top:4px;font-style:italic}
#empty{max-width:420px;text-align:center;opacity:.85}

/* reader */
#reader{overflow-y:auto;scroll-behavior:smooth}
#reader.off{overflow:hidden}
.bar{position:sticky;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;
  background:linear-gradient(rgba(18,19,43,.85),rgba(18,19,43,0));z-index:2;font-size:14px}
.bar button{padding:8px 14px;border-radius:999px;border:1px solid rgba(223,228,247,.25);background:rgba(18,19,43,.5)}
.bar button:hover{border-color:var(--sun)}
article{width:min(640px,100%);padding:6vh 22px 8vh}
article .lab{font-family:var(--display);font-style:italic;font-size:22px;color:var(--sun)}
article h2{font-family:var(--display);font-weight:600;font-size:clamp(34px,6vw,54px);line-height:1.05;margin:4px 0 10px}
article .tag{font-style:italic;opacity:.75;margin-bottom:5vh;font-size:16px}
article p{font-size:18px;line-height:1.8;margin-bottom:.9em}
article p.long{margin-bottom:1.3em}
.note{margin-top:7vh;padding:24px;border-radius:14px;background:rgba(244,184,96,.09);border:1px solid rgba(244,184,96,.3);font-style:italic}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:7vh}
.pn button{padding:12px 18px;border-radius:12px;border:1px solid rgba(223,228,247,.25);max-width:48%;text-align:left}
.pn button:hover{border-color:var(--sun)}
.pn small{display:block;opacity:.6;font-size:12px}

/* realistic book */
#floater{touch-action:none;user-select:none}
#floater.go{animation:none;transform:scale(2.6);opacity:0}
.book{animation:none}
.cover{background:linear-gradient(145deg,#4a2155,#8a3f6e);box-shadow:inset 5px 0 12px rgba(0,0,0,.35)}
.cover::after{content:'';position:absolute;inset:10px;border:1px solid rgba(246,194,122,.55);border-radius:2px;pointer-events:none}
.hinge{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transform:translateZ(26px);transition:transform 1.6s cubic-bezier(.5,0,.2,1)}
.hinge .f{inset:0}
.hinge .front{transform:none}
.hinge .inner{transform:rotateY(180deg);background:#f4ecd8;border-radius:8px 3px 3px 8px}
.pg{position:absolute;left:3px;top:6px;width:200px;height:278px;transform-origin:left center;
  transform:translateZ(calc(20px - var(--i)*5px));border-radius:0 4px 4px 0;
  background:repeating-linear-gradient(#0000 0 21px,rgba(140,100,80,.16) 21px 22px) 22px 30px/150px 214px no-repeat,linear-gradient(90deg,#e2d6bd,#faf3e3 10%,#f4ecd8);
  transition:transform 1.3s cubic-bezier(.5,0,.2,1) calc(.5s + var(--i)*.3s)}
.opening .hinge{transform:translateZ(26px) rotateY(-168deg)}
.opening .pg{transform:translateZ(calc(20px - var(--i)*5px)) rotateY(calc(-158deg - var(--i)*4deg))}
.ribbon{position:absolute;left:150px;top:150px;width:16px;height:200px;transform:translateZ(-2px);transform-origin:50% 0;
  background:linear-gradient(90deg,#c9506f,#f2a7bd 45%,#b8405f);clip-path:polygon(0 0,100% 0,100% 100%,50% 90%,0 100%);animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:translateZ(-2px) rotateX(-4deg) rotateZ(2deg)}}
/* romance */
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#petals i{position:absolute;top:-30px;width:12px;height:16px;border-radius:80% 0 80% 0;opacity:.65;
  background:linear-gradient(135deg,#cfe2fa,#5b8fd9);animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(540deg)}}
#intro h1{font-family:var(--script);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.2;text-shadow:0 0 30px rgba(242,167,189,.45)}
#toc h2{font-family:var(--script);font-weight:400;font-size:clamp(40px,7vw,64px)}
#toc li button{border-color:rgba(242,167,189,.3)}
#toc li button:hover{background:rgba(242,167,189,.16)}
.num{color:var(--rose)}
#reader article{position:relative;width:min(660px,calc(100% - 24px));margin:2vh 0 8vh;padding:7vh 30px 8vh;border-radius:18px;
  background:rgba(26,18,51,.5);backdrop-filter:blur(6px);border:1px solid rgba(242,167,189,.2)}
article .lab{display:none}
article .tag::after{content:'\2661';display:block;margin-top:14px;color:var(--rose);font-style:normal}
.rb{position:absolute;top:0;right:26px;width:40px;padding:14px 0 30px;text-align:center;color:#fff;font:italic 15px var(--display);
  background:linear-gradient(90deg,#c9506f,#f2a7bd 50%,#c9506f);clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%);transform-origin:top;animation:sway2 6s ease-in-out infinite}
@keyframes sway2{50%{transform:rotate(1.5deg)}}
/* paged reader */
#reader{justify-content:center;overflow:hidden}
#reader .bar{position:absolute;top:0;left:0}
#stage{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:34px}
#spread{position:relative;display:flex;perspective:2400px;filter:drop-shadow(0 24px 40px rgba(0,0,0,.55))}
#spread:not(.one)::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:40px;margin-left:-20px;z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(90,60,40,.3),transparent)}
.sheet{position:relative;width:var(--pw);height:var(--ph);padding:28px 26px 44px;color:#3a2a33;font-size:16px;line-height:1.7;background:linear-gradient(90deg,#f3ead6,#faf3e4 12%,#f6eddb);border-radius:0 10px 10px 0}
.sheet.l,#L{border-radius:10px 0 0 10px;background:linear-gradient(270deg,#e3d6bb,#f8f0df 14%,#f3ead6)}
#spread.one .sheet{border-radius:10px}
.pp{width:var(--cw);height:var(--ch);overflow:hidden}
#measure{height:auto;position:absolute;left:-9999px;top:0;visibility:hidden;display:flow-root;font-size:16px;line-height:1.7;font-family:var(--body)}
.pp h2{font:600 30px/1.1 var(--display);color:#5a2347;margin:2px 0 8px}
.pp p{margin:0 0 .8em;color:#3a2a33;font-size:16px;line-height:1.7}
.plab{font:italic 20px var(--display);color:#c9506f}
.ptag{font-style:italic;color:#8a6a76;margin-bottom:18px;font-size:14.5px}
.pnote{font-style:italic;color:#6a3a50}
.pnum{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;font-style:italic;color:#9a7f86}
.flip{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:3}
.fn{left:50%;transform-origin:left center}
.fp{left:0;transform-origin:right center}
.face{position:absolute;inset:0;backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
#bm{position:absolute;top:-8px;right:34px;width:30px;height:62px;z-index:4;transform-origin:top;opacity:.85;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);background:linear-gradient(90deg,#8a6a76,#b9a0aa);transition:height .4s,background .4s}
#bm.on{height:118px;opacity:1;background:linear-gradient(90deg,#c9506f,#f2a7bd 50%,#b8405f)}
#bm:hover{opacity:1}
.pager{display:flex;align-items:center;gap:16px}
.pager button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(242,167,189,.4);font-size:24px;line-height:1;background:rgba(26,18,51,.45)}
.pager button:hover{border-color:var(--sun)}
#hint{font-style:italic;font-size:13.5px;opacity:.8;min-height:1.4em;max-width:300px;text-align:center}
#resume{width:min(560px,100%);margin-bottom:14px;text-align:left;padding:16px 20px;border-radius:14px;background:rgba(242,167,189,.2);border:1px solid var(--rose)}
/* sun */
#sun{width:54px;height:54px;background:radial-gradient(circle at 40% 38%,#fff6d0 0,#ffd978 45%,#f6a94a 100%);
  box-shadow:0 0 28px 8px rgba(255,200,100,.6),0 0 90px 30px rgba(246,150,80,.28)}
#sun::before{content:'';position:absolute;inset:-26px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,120,.8) 0 4deg,transparent 4deg 24deg);
  -webkit-mask:radial-gradient(circle,transparent 0 48%,#000 52%,transparent 100%);mask:radial-gradient(circle,transparent 0 48%,#000 52%,transparent 100%);
  animation:rays 40s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
/* pens and highlights */
#pens{position:fixed;left:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;padding:12px 8px;border-radius:22px;
  background:rgba(26,18,51,.55);border:1px solid rgba(242,167,189,.25);z-index:6}
.pen{position:relative;width:26px;height:44px;border:0;border-radius:4px 4px 10px 10px/4px 4px 14px 14px;background:linear-gradient(90deg,#f7efe0,#d9cdb4);transition:transform .2s,box-shadow .2s}
.pen::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;border-radius:4px 4px 0 0;background:var(--c)}
.pen::after{content:'';position:absolute;left:8px;right:8px;bottom:-6px;height:10px;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%)}
.pen.on{transform:translateX(10px);box-shadow:0 0 0 2px var(--sun)}
.pen.eraser{height:30px;margin-top:4px;background:#f4a3b5}
.pen.eraser::before,.pen.eraser::after{display:none}
.hl{border-radius:3px;padding:0 1px;color:#2a1a22;box-decoration-break:clone;-webkit-box-decoration-break:clone}
@media (max-width:640px){#pens{position:static;transform:none;flex-direction:row;padding:8px 16px}.pen.on{transform:translateY(-8px)}}
/* phone + drawing */
html{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#spread.drawing .ink{pointer-events:auto;touch-action:none;cursor:crosshair}
#pens{align-items:center}
.tool{min-width:40px;height:30px;padding:0 8px;border-radius:15px;border:1px solid rgba(242,167,189,.45);font-size:12px;background:rgba(26,18,51,.6);color:var(--moon)}
.tool.on{background:var(--rose);color:#2a1030}
.tool i{display:block;margin:auto;border-radius:50%;background:var(--moon)}
@media (max-width:640px){
  #pens{gap:7px;padding:8px 12px;max-width:calc(100% - 16px)}
  .pen{width:22px;height:38px}
  .pen::before{height:14px}
  .pen.eraser{height:26px;margin-top:0}
  .tool{min-width:36px;padding:0 6px}
  .pager button{width:52px;height:52px}
  .bar button{min-height:42px;padding:10px 16px}
  #reader{padding-bottom:env(safe-area-inset-bottom)}
  #hint{font-size:12.5px;max-width:200px}
}
@media (prefers-reduced-motion:reduce){#sun::before{animation:none}}
@media (prefers-reduced-motion:reduce){#petals{display:none}.ribbon,.rb{animation:none}}
@media (prefers-reduced-motion:reduce){
  .book,#floater,#shadow,#sky i{animation:none}
  .book{transform:rotateX(-8deg) rotateY(-20deg)}
}

/* ===== floral + pinterest layer ===== */
.sheet{background:var(--grain),var(--pat),linear-gradient(90deg,#f3ead6,#faf3e4 12%,#f6eddb);
  box-shadow:inset 0 0 0 10px #0000,inset 0 0 0 11px rgba(201,80,111,.2)}
.sheet.l,#L{background:var(--grain),var(--pat),linear-gradient(270deg,#e3d6bb,#f8f0df 14%,#f3ead6)}
.sheet::before,.sheet::after{content:'';position:absolute;pointer-events:none;z-index:0;background:center/contain no-repeat}
.sheet::before{right:4px;bottom:4px;width:150px;height:150px;background-image:var(--bq);opacity:.4}
.sheet::after{right:-6px;top:2px;width:112px;height:56px;background-image:var(--tp)}
.sheet.l::before,.sheet.l::after{right:auto;transform:scaleX(-1)}
.sheet.l::before{left:4px}.sheet.l::after{left:-6px}
.pp{position:relative;z-index:1}
.pnum{z-index:1}.pnum::before{content:'\273F  ';color:#5b8fd9}.pnum::after{content:'  \273F';color:#5b8fd9}
.pp h2::after{content:'';display:block;height:16px;margin-top:6px;background:var(--dv) left center/124px 16px no-repeat}
.rm{position:absolute;left:50%;top:50%;width:80%;aspect-ratio:1;translate:-50% -50%;pointer-events:none;z-index:0;opacity:.1;color:#b8405f}
.rm.first{opacity:.2;width:94%;top:60%}
.rm svg,.ring{width:100%;height:100%;display:block;overflow:visible}
.ring text{font-family:'Great Vibes',cursive;font-size:var(--fs,15px);fill:currentColor}
.bigring{position:absolute;left:50%;top:50%;width:min(86vw,560px);aspect-ratio:1;translate:-50% -50%;z-index:-1;pointer-events:none;color:#f2a7bd;opacity:.85;text-shadow:0 0 14px rgba(242,167,189,.5)}
.bigring svg{animation:spinr 140s linear infinite;--fs:10.5px}
.orb{position:fixed;width:150px;height:150px;pointer-events:none;opacity:.75}
.orb svg{animation:spinr 70s linear infinite;--fs:12px}
#moonRing{right:calc(7vw - 43px);top:calc(5vh - 43px);color:#dfe4f7}
#sunRing{left:calc(6vw - 48px);bottom:calc(6vh - 48px);color:#ffd978}
#sunRing svg{animation-direction:reverse}
#tocRing{position:absolute;left:50%;top:calc(9vh - 120px);width:min(92vw,400px);aspect-ratio:1;translate:-50% 0;z-index:-1;pointer-events:none;color:#f2a7bd;opacity:.6}
#tocRing svg{animation:spinr 160s linear infinite;--fs:11px}
@keyframes spinr{to{transform:rotate(360deg)}}
#toc li button{position:relative;padding-right:64px}
#toc li button::after{content:'';position:absolute;right:18px;top:50%;width:30px;height:30px;margin-top:-15px;background:var(--mini) center/contain no-repeat}
#flora{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#flora b{position:absolute;bottom:-40px;font:400 clamp(22px,3.4vw,34px) 'Great Vibes',cursive;color:#f7c6d4;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.4}80%{opacity:.25}to{opacity:0;transform:translateY(-110vh) rotate(var(--r))}}
#flora svg{position:absolute;width:34px;height:30px;left:-50px;animation:fly linear infinite;opacity:.85}
#flora svg g.w{transform-box:fill-box;transform-origin:center;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.3)}}
@keyframes fly{to{transform:translate(calc(100vw + 120px),var(--dy))}}
@media (prefers-reduced-motion:reduce){#flora,.bigring svg,.orb svg,#tocRing svg{animation:none}#flora{display:none}}

/* ===== prettier pass ===== */
#sky::before,#sky::after{content:'';position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
#sky::before{width:60vw;height:60vw;left:-15vw;top:-10vw;background:radial-gradient(circle,rgba(242,167,189,.32),transparent 65%)}
#sky::after{width:55vw;height:55vw;right:-12vw;bottom:-14vw;background:radial-gradient(circle,rgba(246,194,122,.22),transparent 65%)}
#intro h1{background:linear-gradient(90deg,#fff,#f9c9da 50%,#ffe3a8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(242,167,189,.45))}
.pp h2{font:400 40px/1.05 'Great Vibes',cursive;color:#a8325a;margin:0 0 4px}
.plab{font:400 26px 'Great Vibes',cursive;color:#d0668a}
.ptag+p::first-letter{float:left;font:400 52px/.8 'Great Vibes',cursive;color:#c9506f;padding:6px 8px 0 0}
.sheet::before{width:175px;height:175px;opacity:.5}
#toc li button{grid-template-columns:72px 1fr;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(242,167,189,.08));border:1px solid rgba(247,198,212,.35);box-shadow:0 8px 24px rgba(10,5,30,.25),inset 0 1px 0 rgba(255,255,255,.12)}
#toc li button:hover{transform:translateY(-3px);background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(242,167,189,.2));box-shadow:0 12px 30px rgba(242,167,189,.22)}
.num{font:400 32px/1 'Great Vibes',cursive}
#toc .dedication::after{content:'\273F  \2740  \273F';display:block;margin-top:10px;color:var(--rose);letter-spacing:.4em;font-style:normal}
.bar button,.pager button{background:rgba(255,236,242,.12);border-color:rgba(247,198,212,.5);backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(242,167,189,.15)}
.bar button:hover,.pager button:hover{background:rgba(242,167,189,.3)}
#petals i.p2{width:24px;height:30px;filter:blur(1.5px);opacity:.4}

<div id="sky"></div>
<div id="moon" aria-hidden="true"></div>
<div id="sun" aria-hidden="true"></div>
<div id="petals" aria-hidden="true"></div>

<!-- 1. flying book -->
<section id="intro" class="screen">
  <div id="floater" role="button" tabindex="0" aria-label="Open the book">
    <div class="book" id="bk">
      <div class="f cover back"><img data-base="assets/back" alt=""></div>
      <i class="pg" style="--i:0"></i><i class="pg" style="--i:1"></i><i class="pg" style="--i:2"></i><i class="pg" style="--i:3"></i>
      <div class="ribbon"></div>
      <div class="f spine"></div><div class="f pages"></div><div class="f top"></div><div class="f bottom"></div>
      <div class="hinge">
        <div class="f cover front"><span id="fallbackTitle">For Jia</span><img data-base="assets/front" alt=""></div>
        <div class="f cover inner"></div>
      </div>
    </div>
    <div id="shadow"></div>
  </div>
  <h1 id="bookTitle">If My Heart Could Sit Beside You, It Would Say All of This</h1>
  <p>Turn it in your hands, then tap to open it, my love</p>
</section>

<!-- 2. chapters -->
<section id="toc" class="screen off">
  <h2>Come in, my love</h2>
  <div class="dedication" id="dedication">For my Jia</div>
  <button id="resume" hidden></button>
  <ol id="list"></ol>
  <p id="empty" hidden>No chapters found yet. Paste the book text into book.js and refresh.</p>
</section>

<!-- 3. reading -->
<section id="reader" class="screen off">
  <div class="bar">
    <button id="toToc">Contents</button>
    <button id="mute" aria-pressed="false">Music on</button>
  </div>
  <div id="stage">
    <div id="spread">
      <div class="sheet l" id="L"></div><div class="sheet r" id="R"></div>
      <button id="bm" aria-label="Save my place"></button>
    </div>
    <div id="pens" role="toolbar" aria-label="Highlighter pens"></div>
    <div class="pager"><button id="prev" aria-label="Previous page">&#8249;</button><p id="hint"></p><button id="next" aria-label="Next page">&#8250;</button></div>
  </div>
</section>

<script>const isNote=items=>!!(items&&items[0]&&items[0].cls&&items[0].cls.includes('ntop'));
let scrollOpened=false;
const SCROLL_HTML='<i></i><svg class="rib" viewBox="0 0 80 110" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8fe8"/><stop offset=".55" stop-color="#2a52b0"/><stop offset="1" stop-color="#14307a"/></linearGradient></defs><path d="M38 52L22 100L32 93L39 103Z" fill="url(#rg)" stroke="#e3c37b"/><path d="M42 52L58 100L48 93L41 103Z" fill="url(#rg)" stroke="#e3c37b"/><rect x="29" y="12" width="22" height="68" fill="url(#rg)"/><path d="M29 12V80M51 12V80" stroke="#e3c37b" stroke-width="1.6"/><path d="M40 48C22 20 6 30 14 46C20 57 34 53 40 48Z" fill="url(#rg)" stroke="#e3c37b"/><path d="M40 48C58 20 74 30 66 46C60 57 46 53 40 48Z" fill="url(#rg)" stroke="#e3c37b"/><circle cx="40" cy="49" r="7" fill="#2a52b0" stroke="#e3c37b" stroke-width="1.5"/></svg><b class="tapme">Tap the scroll to open it</b>';</script>
<script src="book.js"></script>
<script>
/* ---- Music: one mp3 per chapter, in order. Rename the files or edit this list. ---- */
const INTRO_AUDIO = 'assets/intro.mp3';            // optional, plays softly on the chapter list
const AUDIO = [1,2,3,4,5,6,7,8].map(n => encodeURI(`Chapter ${n}.mp3`));
let VOLUME = (()=>{try{const v=parseFloat(localStorage.getItem('jiya-vol'));return isNaN(v)?0.6:v;}catch(e){return 0.6;}})();

/* ---- Backgrounds per chapter [top, bottom] ---- */
const SKIES = [
  ['#070d2e','#1a3a8f'],['#0a1238','#27479e'],['#081030','#1f4ba8'],['#0c1440','#2d3f99'],
  ['#071033','#183c8c'],['#0b1545','#2a52b0'],['#060c2b','#1c3f97'],['#0a1237','#25449d']
];

/* ---- Parse the book text into chapters ---- */
function parse(text){
  const lines = (text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const re = /^(Chapter [IVX]+|Final Chapter)\s+[—–-]\s+(.+)$/;
  const head=[], chapters=[]; let cur=null, inNote=false;
  for(const l of lines){
    const m = l.match(re);
    if(m){ cur={label:m[1].replace('Chapter ','').replace('Final Chapter','Final'),title:m[2],tag:'',paras:[],note:[]}; chapters.push(cur); inNote=false; continue; }
    if(!cur){ head.push(l); continue; }
    if(/^A little note to keep/i.test(l)){ inNote=true; continue; }
    if(inNote) cur.note.push(l);
    else if(!cur.tag && !cur.paras.length) cur.tag=l;
    else cur.paras.push(l);
  }
  return {head,chapters};
}
const book = parse(window.BOOK_TEXT);
const chapters = book.chapters;

/* ---- Stars ---- */
const sky = document.getElementById('sky');
for(let i=0;i<80;i++){
  const s=document.createElement('i');
  s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
  s.style.animationDelay=(Math.random()*4)+'s';
  s.style.transform=`scale(${.6+Math.random()*1.2})`;
  sky.appendChild(s);
}
function setSky(i){
  const c = SKIES[i] || SKIES[0];
  document.documentElement.style.setProperty('--a',c[0]);
  document.documentElement.style.setProperty('--b',c[1]);
}

/* ---- Titles from the book text ---- */
if(book.head.length>=2){
  const t = book.head[1];
  document.getElementById('bookTitle').textContent = t;
  document.getElementById('fallbackTitle').textContent = t;
  document.title = t;
  if(book.head[0]) document.getElementById('dedication').textContent = book.head[0].replace(/^TO MY /i,'For my ');
}

/* ---- Music ---- */
let current=null, muted=false;
function fade(a,to,done){
  clearInterval(a._t);
  a._t=setInterval(()=>{
    const d=to-a.volume;
    if(Math.abs(d)<=.03){a.volume=to;clearInterval(a._t);done&&done();}
    else a.volume=Math.min(1,Math.max(0,a.volume+Math.sign(d)*.03));
  },70);
}
function playTrack(src){
  if(current && current._src===src) return;
  const next=new Audio(src); next._src=src; next.loop=true; next.volume=0;
  next.play().catch(()=>{});
  fade(next, muted?0:VOLUME);
  if(current){ const old=current; fade(old,0,()=>old.pause()); }
  current=next;
}
const muteBtn=document.getElementById('mute');
muteBtn.onclick=()=>{
  muted=!muted;
  muteBtn.textContent = muted?'Music off':'Music on';
  muteBtn.setAttribute('aria-pressed',muted);
  if(current) fade(current, muted?0:VOLUME);
};

/* ---- Screens ---- */
const screens={intro:document.getElementById('intro'),toc:document.getElementById('toc'),reader:document.getElementById('reader')};
function show(name){ document.body.dataset.s=name; for(const k in screens) screens[k].classList.toggle('off',k!==name); }

/* ---- Contents ---- */
const list=document.getElementById('list');
if(!chapters.length){ document.getElementById('empty').hidden=false; }
chapters.forEach((c,i)=>{
  const li=document.createElement('li'), b=document.createElement('button');
  b.innerHTML='<span class="num"></span><span><span class="ct"></span><span class="tg"></span></span>';
  b.querySelector('.num').textContent=c.label;
  b.querySelector('.ct').textContent=c.title;
  b.querySelector('.tg').textContent=c.tag;
  b.onclick=()=>openChapter(i);
  li.appendChild(b); list.appendChild(li);
});

/* ---- Reader: chapters laid out as real book pages ---- */
const L=document.getElementById('L'), R=document.getElementById('R'), spread=document.getElementById('spread');
const bmBtn=document.getElementById('bm'), hint=document.getElementById('hint');
const PADX=26, PADT=28, PADB=44, KEY='jiya-bookmark';
let two=true, PW=400, PH=560, chap=0, pages=[], s=0, busy=false, bm=null;
try{ bm=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
const meas=document.createElement('div'); meas.className='pp'; meas.id='measure'; document.body.appendChild(meas);
const cache={};
let hls=[]; try{ hls=JSON.parse(localStorage.getItem('jiya-hl')||'[]'); }catch(e){}
let pen=null, mouseDown=false, mode='mark', lastW=0, lastH=0;
const mk=(o,hl)=>{
  const e=document.createElement(o.tag); if(o.cls) e.className=o.cls;
  if(hl&&o.pi>=0){ e.dataset.pi=o.pi; e.dataset.off=o.off||0; }
  const end=o.off+o.text.length;
  const hs=hl&&o.pi>=0?hls.filter(h=>h.ch===chap&&h.pi===o.pi&&h.b>o.off&&h.a<end):[];
  if(!hs.length){ e.textContent=o.text; return e; }
  const col=new Array(o.text.length).fill(null);
  hs.forEach(h=>{ for(let i=Math.max(h.a,o.off);i<Math.min(h.b,end);i++) col[i-o.off]=h.c; });
  for(let i=0;i<col.length;){
    let j=i; while(j<col.length&&col[j]===col[i]) j++;
    const t=o.text.slice(i,j);
    if(col[i]){ const m=document.createElement('span'); m.className='hl'; m.style.background=col[i]; m.textContent=t; e.appendChild(m); }
    else e.appendChild(document.createTextNode(t));
    i=j;
  }
  return e;
};

function dims(){
  two=innerWidth>=900; PH=Math.max(340,Math.min(innerHeight-(innerWidth>=900?150:218),640));
  PW=Math.floor(two?Math.min(430,(innerWidth-90)/2):Math.min(innerWidth-28,470));
  const r=document.documentElement.style;
  r.setProperty('--pw',PW+'px'); r.setProperty('--ph',PH+'px');
  r.setProperty('--cw',(PW-PADX*2)+'px'); r.setProperty('--ch',(PH-PADT-PADB)+'px');
  meas.style.width=(PW-PADX*2)+'px'; L.style.display=two?'':'none'; spread.classList.toggle('one',!two);
}
function paginate(c){
  const H=PH-PADT-PADB, out=[];
  const fits=a=>{meas.innerHTML='';a.forEach(o=>meas.appendChild(mk(o)));return meas.offsetHeight<=H;};
  let items=[{tag:'div',text:c.label==='Final'?'Final chapter':'Chapter '+c.label,cls:'plab',pi:-1},{tag:'h2',text:c.title,pi:-1},{tag:'div',text:c.tag,cls:'ptag',pi:-1}];
  const q=c.paras.map((t,i)=>({tag:'p',text:t,pi:i})).concat(c.note.map((t,i)=>({tag:'p',text:t,cls:'pnote'+(i===0?' ntop':''),pi:c.paras.length+i})));
  for(const o of q){
    if(o.cls&&o.cls.includes('ntop')&&items.length){ out.push(items); items=[]; }
    let text=o.text, first=true;
    while(text){
      const start=o.text.length-text.length; const part=t=>({...o,text:t,off:start,cls:((o.cls||'')+(first?'':' cont')).trim()});
      if(fits([...items,part(text)])){ items.push(part(text)); break; }

    VOLUME=+vol.value; try{ localStorage.setItem('jiya-vol',VOLUME); }catch(e){}
    if(muted&&VOLUME>0) muteBtn.onclick();
    if(current){ clearInterval(current._t); current.volume=muted?0:VOLUME; }
    paint();
  };
  vsp.onclick=()=>{ muteBtn.onclick(); paint(); };
  muteBtn.addEventListener('click',()=>setTimeout(paint,0));
  paint();
}

{

{
